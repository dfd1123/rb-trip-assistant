name: build

# CI: main·PR 은 테스트(단위+E2E). Actions 탭에서 수동 실행하면 전 플랫폼 빌드를 Artifacts 로 받는다.
# 배포(Release·자동 업데이트)는 로컬에서 `yarn deploy` (scripts/deploy.sh) — 맥 서명·공증에 회사 인증서가 필요해서.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - name: E2E (가짜 아마란스에 신청서·보고서 입력)
        run: xvfb-run -a -s "-screen 0 1600x1100x24" yarn electron test/e2e.js --no-sandbox


  build:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: --win }
          - { os: macos-latest, args: --mac }
          - { os: ubuntu-latest, args: --linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --frozen-lockfile --network-timeout 600000
      - name: rpm 도구 (리눅스 rpm 패키지용)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: 빌드 (태그면 Release 에 업로드)
        shell: bash
        run: node scripts/write-builtin-key.js && yarn electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ github.token }}
          # macOS 서명·공증: repo Secrets 에 아래가 있으면 서명+공증, 없으면 서명 없이 빌드
          #   MAC_CERT_P12_BASE64(Developer ID Application 인증서 .p12 를 base64) / MAC_CERT_PASSWORD
          #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (공증용)
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 != '') && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 있으면 팀 공용 Gemini 키 내장 (repo Settings → Secrets)
      - uses: actions/upload-artifact@v4
        with:
          name: trip-assistant-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml
          if-no-files-found: error
